<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" aria-hidden="true">
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #111111;
        stroke-width: 2;
      }
      .accent {
        stroke: #0e5e73;
      }
      .fill {
        fill: #111111;
      }
      .text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        fill: #111111;
      }
    </style>

    <symbol id="process-flow" viewBox="0 0 880 220">
      <rect x="60" y="60" width="220" height="96" class="stroke" />
      <rect x="332" y="60" width="220" height="96" class="stroke" />
      <rect x="604" y="60" width="220" height="96" class="stroke accent" />
      <line x1="280" y1="108" x2="332" y2="108" class="stroke" />
      <line x1="552" y1="108" x2="604" y2="108" class="stroke" />
      <text x="170" y="114" text-anchor="middle" class="text">Upstream</text>
      <text x="442" y="114" text-anchor="middle" class="text">Downstream</text>
      <text x="714" y="114" text-anchor="middle" class="text">Fill/Finish</text>
    </symbol>

    <symbol id="upstream-loop" viewBox="0 0 880 320">
      <rect x="280" y="72" width="320" height="176" class="stroke" />
      <text x="440" y="132" text-anchor="middle" class="text">Bioreactor</text>
      <text x="440" y="162" text-anchor="middle" class="text">Controlled Core</text>
      <rect x="64" y="84" width="156" height="56" class="stroke" />
      <rect x="64" y="176" width="156" height="56" class="stroke" />
      <rect x="660" y="84" width="156" height="56" class="stroke accent" />
      <rect x="660" y="176" width="156" height="56" class="stroke" />
      <line x1="220" y1="112" x2="280" y2="112" class="stroke" />
      <line x1="220" y1="204" x2="280" y2="204" class="stroke" />
      <line x1="600" y1="112" x2="660" y2="112" class="stroke" />
      <line x1="600" y1="204" x2="660" y2="204" class="stroke" />
    </symbol>

    <symbol id="downstream-train" viewBox="0 0 980 280">
      <rect x="24" y="88" width="150" height="72" class="stroke" />
      <rect x="208" y="88" width="150" height="72" class="stroke" />
      <rect x="392" y="88" width="150" height="72" class="stroke" />
      <rect x="576" y="88" width="150" height="72" class="stroke" />
      <rect x="760" y="88" width="190" height="72" class="stroke accent" />
      <line x1="174" y1="124" x2="208" y2="124" class="stroke" />
      <line x1="358" y1="124" x2="392" y2="124" class="stroke" />
      <line x1="542" y1="124" x2="576" y2="124" class="stroke" />
      <line x1="726" y1="124" x2="760" y2="124" class="stroke" />
    </symbol>

    <symbol id="cost-risk-gradient" viewBox="0 0 900 300">
      <line x1="100" y1="40" x2="100" y2="252" class="stroke" />
      <line x1="100" y1="252" x2="860" y2="252" class="stroke" />
      <rect x="170" y="196" width="120" height="56" fill="#d7e2e6" />
      <rect x="330" y="174" width="120" height="78" fill="#b9d0d8" />
      <rect x="490" y="136" width="120" height="116" fill="#8aaeb9" />
      <rect x="650" y="92" width="120" height="160" fill="#0e5e73" />
    </symbol>
  </defs>
</svg>
