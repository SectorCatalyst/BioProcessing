# Isolated from render.yaml and the comprehensive calculator.
services:
  - type: web
    runtime: static
    name: biopilot-quick-roi
    repo: https://github.com/SectorCatalyst/BioProcessing
    branch: codex/biopilot-quick-roi-20261007
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:quick
    staticPublishPath: quick-roi-site/out
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; upgrade-insecure-requests"
