services:
  - type: web
    name: bioprocessing-roi
    runtime: node
    branch: codex/bioprocess-simulator-rework
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bioprocessing-roi-db
          property: connectionString
      - key: LEAD_CAPTURE_ADMIN_KEY
        sync: false

databases:
  - name: bioprocessing-roi-db
    plan: starter
