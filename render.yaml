services:
  - type: web
    name: bioprocessing-roi
    runtime: node
    branch: codex/biopilot-survey-data-enhancements
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bioprocessing-roi-db
          property: connectionString
      - key: LEAD_CAPTURE_ADMIN_KEY
        sync: false
      - key: BIOPILOT_EMAIL_WEBHOOK_URL
        sync: false
      - key: BIOPILOT_EMAIL_WEBHOOK_SECRET
        sync: false
      - key: BIOPILOT_NOTIFICATION_RECIPIENTS
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: POSTMARK_MESSAGE_STREAM
        value: outbound
      - key: POSTMARK_REPLY_TO
        sync: false
      - key: BIOPILOT_ABANDONMENT_MINUTES
        value: "60"
      - key: BIOPILOT_NOTIFICATION_CRON_KEY
        sync: false
      - key: BIOPILOT_PUBLIC_BASE_URL
        value: https://bioprocessing-roi.onrender.com
      - key: SALES_NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

databases:
  - name: bioprocessing-roi-db
    plan: starter
