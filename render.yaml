services:
  - type: web
    name: bioprocessing-roi
    runtime: node
    branch: codex/bioprocess-simulator-rework
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bioprocessing-roi-db
          property: connectionString
      - key: LEAD_CAPTURE_ADMIN_KEY
        sync: false
      - key: SALES_NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

databases:
  - name: bioprocessing-roi-db
    plan: starter
